name: Project installer safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s Tests -p test_installer.py -v
      - run: python3 Scripts/metalvasp.py --help
      - run: python3 Scripts/audit-public-package.py .
# No VASP download, source, secrets, proprietary fixtures or GPU-performance claims.

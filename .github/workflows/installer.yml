name: Project installer safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 Scripts/metalvasp.py --help
      - run: python3 Scripts/audit-public-package.py .
# No VASP download, source, secrets, proprietary fixtures or GPU-performance claims.
